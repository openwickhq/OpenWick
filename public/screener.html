<!doctype html>
<html lang="en" data-theme="dark" class="page">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screener · OpenWick</title>
    <link rel="icon" type="image/svg+xml" href="/img/logo.svg" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/site.css" />
  </head>
  <body>
    <header class="h-nav"></header>
    <main class="wrap screener">
      <div class="pg-head">
        <h1>Screener</h1>
        <div class="seg" id="markets">
          <button data-u="nse">NIFTY 500 stocks</button>
          <button data-u="indices">Indian indices</button>
          <button data-u="crypto500">Crypto top 500</button>
          <button data-u="crypto">Binance pairs</button>
        </div>
      </div>

      <div class="presets" id="presets"></div>
      <div class="filters" id="filters"></div>

      <details class="scan" id="scanBox">
        <summary>Custom technical rule <span class="muted" id="scanState"></span></summary>
        <div class="scan-body">
          <div class="rules" id="scRule"></div>
          <label class="field">On<select id="scTf"><option>1h</option><option>4h</option><option selected>1D</option><option>1W</option></select></label>
          <button class="btn primary" id="scScan">Scan the top 100</button>
          <button class="btn hidden" id="scClear">Clear</button>
          <span class="hint-text">Checks the 100 largest rows that pass the filters above against the rule, using each one's candles.</span>
        </div>
      </details>

      <div class="views-bar">
        <div class="views" id="views"></div>
        <span class="spacer"></span>
        <span class="sc-count" id="count"></span>
        <button class="pill btnlike" id="screenAlert" title="Get an alert when a new stock starts matching these filters">
          <svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20h4" /></svg>Alert on new matches
        </button>
        <button class="pill btnlike" id="csv" title="Download the rows and columns shown">Export CSV</button>
      </div>
      <div class="sa-strip" id="screenAlerts" hidden></div>
      <div class="sc-wrap"><table class="sc" id="table"></table></div>
      <div class="sc-meta"><span class="muted" id="note"></span><span class="spacer"></span><span class="muted" id="freshness"></span></div>
    </main>
    <script type="module" src="/js/screener-page.js"></script>
  </body>
</html>
