# Push a version tag (git tag v1.0.0 && git push origin v1.0.0) and this builds the downloads the
# installers fetch (openwick.tar.gz, openwick.zip, SHA256SUMS) into a draft GitHub release, adds
# the desktop installers to it (Windows .exe, macOS .dmg for Apple chip and Intel, Linux .AppImage
# and .deb), and only then makes it public. If any build fails, the release stays a hidden draft.
# The tag must match "version" in package.json (v1.0.0 = 1.0.0).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Offline tests
        run: npm test
      - name: Build the downloads
        run: node scripts/package.js
      - name: Release notes from CHANGELOG.md
        # The "## v1.2.3" section for this tag, or GitHub's generated notes if there isn't one.
        run: |
          awk -v v="## $GITHUB_REF_NAME" '$0 == v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then echo "NOTES=--notes-file $RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"; else echo "NOTES=--generate-notes" >> "$GITHUB_ENV"; fi
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "OpenWick $GITHUB_REF_NAME" $NOTES

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: --linux
          - os: windows-latest
            build: --win
          - os: macos-latest
            build: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the desktop installers
        shell: bash
        run: npx --yes electron-builder@26.18.0 --config electron-builder.yml ${{ matrix.build }} --publish never
      - name: Add them to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/desktop/*.exe dist/desktop/*.dmg dist/desktop/*.AppImage dist/desktop/*.deb)
          [ ${#files[@]} -gt 0 ] || { echo "No installers were built"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Make the release public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
